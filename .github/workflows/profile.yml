name: Profile

on:
  workflow_call:
    inputs:
      zkvm:
        description: zkVM to profile the guests on.
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # OpenVM arrives as a git dependency whose submodule tree carries the whole of openssl. libgit2
  # fails partway through a clone that size, so fetching goes through the git CLI instead.
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  # OpenVM's rvr backend translates a guest to C and builds it, so it picks the LLVM toolchain the
  # install step below puts on PATH rather than the distribution clang.
  RVR_CC: clang-22
  RVR_LD: lld

jobs:
  # The registry lists the guests each zkVM has a published ELF for, so the matrix is read from it
  # rather than restated by every caller.
  guests:
    runs-on: ubuntu-latest
    outputs:
      stateless-validators: ${{ steps.registry.outputs.stateless-validators }}
    steps:
      - uses: actions/checkout@v7

      - id: registry
        env:
          ZKVM: ${{ inputs.zkvm }}
        run: |
          echo "stateless-validators=$(jq -c --arg zkvm "${ZKVM}" \
            '.[$zkvm] | map(.["stateless-validator"])' elf-registry.json)" >> "${GITHUB_OUTPUT}"

  profile:
    needs: guests
    name: ${{ matrix.stateless-validator }}-${{ inputs.zkvm }}
    runs-on: ubuntu-latest
    env:
      # A pull request profiles a tenth of the corpus, which catches a regression in the profiler
      # without spending hours per guest.
      FIXTURE_FILE_ID: ${{ github.event_name == 'pull_request' && '1vG7JU-BV1QTRUU00doX99Ym4dHTYBoB0' || '1KMJJHKmnZrN1CQlFyiL-i69cx46H8Tr0' }}
      FIXTURE_SET: ${{ github.event_name == 'pull_request' && 'mainnet-25580000-100' || 'mainnet-25580000-1000' }}
    strategy:
      fail-fast: false
      matrix:
        stateless-validator: ${{ fromJSON(needs.guests.outputs.stateless-validators) }}
    steps:
      - uses: actions/checkout@v7

      # The corpus is 15 GB extracted beside its cached archive, past what a stock runner has free.
      - name: Free up disk space
        run: bash .github/scripts/free-up-disk-space.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential clang libclang-dev libgmp-dev libomp-dev libopenmpi-dev \
            libsodium-dev nasm nlohmann-json3-dev openmpi-bin protobuf-compiler uuid-dev zstd

      - name: Install the LLVM toolchain
        run: bash .github/scripts/install-llvm.sh

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          # A branch saves under its own cache scope, and the OpenVM build tree is large enough that
          # a copy per branch would evict the fixture archives, so only main writes.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo build --release --locked

      # Only the archive is cached, keyed by the file id that identifies the corpus, so a rerun skips
      # the Drive download. It has to stay on disk for the post-job save, which is why the download
      # writes a file rather than piping into tar.
      - name: Cache fixtures
        id: fixtures
        uses: actions/cache@v6
        with:
          path: fixtures.tar.zst
          key: fixtures-${{ env.FIXTURE_FILE_ID }}

      - name: Download fixtures
        if: steps.fixtures.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o fixtures.tar.zst \
            "https://drive.usercontent.google.com/download?id=${FIXTURE_FILE_ID}&export=download&confirm=t"

      # --strip-components=1 drops the archive's top-level directory so the fixtures land directly
      # under fixtures/<set>.
      - name: Extract fixtures
        run: |
          mkdir -p "fixtures/${FIXTURE_SET}"
          tar --zstd -xf fixtures.tar.zst -C "fixtures/${FIXTURE_SET}" --strip-components=1
          find "fixtures/${FIXTURE_SET}" -name '*.json' | wc -l

      - name: Profile
        # A guest downloaded from an ere-guests build artifact, which is what every pin other than
        # a tag resolves to, is served by the GitHub API only to an authenticated caller. ere-guests
        # is public, so the job's own token is enough and no cross-repository secret is needed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./target/release/zkevm-prof profile \
            --zkvm ${{ inputs.zkvm }} \
            --stateless-validator ${{ matrix.stateless-validator }} \
            --input "fixtures/${FIXTURE_SET}" \
            --output "${{ matrix.stateless-validator }}-${{ inputs.zkvm }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: profile-${{ matrix.stateless-validator }}-${{ inputs.zkvm }}
          path: ${{ matrix.stateless-validator }}-${{ inputs.zkvm }}.json

  report:
    needs: profile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Every caller publishes into the same Pages branch, and a caller's own concurrency group does
    # not cover the others, so publication is serialised here instead.
    concurrency:
      group: publish-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential clang libclang-dev libgmp-dev libomp-dev libopenmpi-dev \
            libsodium-dev nasm nlohmann-json3-dev openmpi-bin protobuf-compiler uuid-dev

      - name: Install the LLVM toolchain
        run: bash .github/scripts/install-llvm.sh

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo build --release --locked

      - uses: actions/download-artifact@v8
        with:
          pattern: profile-*
          merge-multiple: true
          path: profiles

      # The page is static and loads one JSON per zkVM, so publishing copies the site next to a
      # report named after the zkVM this run profiled.
      - name: Report
        run: |
          cp -r site publish
          ./target/release/zkevm-prof report --input profiles/*.json --output "publish/${{ inputs.zkvm }}.json"
          ./target/release/zkevm-prof report --input profiles/*.json --output report.md --format md
          cat report.md >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: |
            publish/${{ inputs.zkvm }}.json
            report.md

      # Every zkVM publishes the same static site to the root, and keep_files leaves the other
      # zkVMs' JSON in place, so a run only ever replaces its own tab's data.
      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
          keep_files: true
