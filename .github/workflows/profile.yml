name: Profile

on:
  workflow_call:
    inputs:
      zkvm:
        description: zkVM to profile the guest on.
        required: true
        type: string
      stateless-validator:
        description: Guest to profile.
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # ere's catalog resolves ere's own workspace to name a zkVM SDK version, and that workspace carries
  # OpenVM, whose submodule tree holds the whole of openssl. libgit2 fails partway through a clone
  # that size, so fetching goes through the git CLI instead.
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  # Branch the page is published to, which is also where a run reads the profiles already published
  # so it can tell an ELF it has already measured from one it has not.
  PAGES_BRANCH: gh-pages

jobs:
  # One guest, profiled and published on its own, so a corpus a guest gets through in an hour is on
  # the page an hour later rather than when the slowest guest of its zkVM is done.
  profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUITE: mainnet-25580000-1000
      # A pull request profiles the first hundred blocks of that corpus rather than a corpus of its
      # own, which catches a regression in the profiler without spending hours per guest.
      FILTER: ${{ github.event_name == 'pull_request' && 'block_255800[0-9][0-9]_' || '' }}
    steps:
      - uses: actions/checkout@v7

      # The published profiles, which the profiler reads to skip a guest whose ELF it has already
      # measured on this zkVM version. Only the code for no such branch means nothing is published
      # yet, since taking a fault for an absent branch would reprofile this guest for hours against
      # a page that already holds it.
      - name: Look for the published page
        id: pages
        run: |
          status=0
          git ls-remote --exit-code --heads origin "${PAGES_BRANCH}" > /dev/null || status=$?
          case "${status}" in
            0) echo "exists=true" >> "${GITHUB_OUTPUT}" ;;
            2) ;;
            *) exit "${status}" ;;
          esac

      - uses: actions/checkout@v7
        if: steps.pages.outputs.exists == 'true'
        with:
          ref: ${{ env.PAGES_BRANCH }}
          path: published

      # The corpus is 15 GB extracted and the `ere-server` image the profiler pulls lands on the same
      # filesystem, both past what a stock runner has free. The images the runner ships are dropped
      # too, since this job uses none of them.
      - name: Free up disk space
        run: |
          bash .github/scripts/free-up-disk-space.sh
          docker image prune --all --force

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          # A branch saves under its own cache scope, and the OpenVM clone ere's catalog pulls into
          # the git cache is large enough that a copy per branch would exhaust what a repository
          # gets, so only main writes.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A branch restores the cache main last wrote, so a revision newer than that is cloned cold,
      # and the OpenVM submodule tree is large enough that one network fault fails the job. The
      # compile clones it too, ere's catalog resolving ere's workspace from its own build script, so
      # both are retried.
      - name: Fetch dependencies
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --locked; then exit 0; fi
            sleep 15
          done
          exit 1

      - name: Build
        run: |
          for attempt in 1 2 3; do
            if cargo build --release --locked; then exit 0; fi
            sleep 15
          done
          exit 1

      # The profile lands under the guest, the hash of the ELF it measured and the corpus it covers,
      # which is the path the page fetches it by. Profiling runs against a copy of what is already
      # published, so a guest whose ELF has already been measured on this zkVM version is skipped,
      # and only what this job actually wrote is carried forward. The corpus the suite names is
      # fetched by the profiler after that check, so a skipped guest downloads nothing at all.
      - name: Profile
        # A guest downloaded from an ere-guests build artifact, which is what every pin other than
        # a tag resolves to, is served by the GitHub API only to an authenticated caller. ere-guests
        # is public, so the job's own token is enough and no cross-repository secret is needed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZKVM: ${{ inputs.zkvm }}
          STATELESS_VALIDATOR: ${{ inputs.stateless-validator }}
        run: |
          mkdir -p profiles produced standing
          if [[ -d published/profiles ]]; then cp -r published/profiles/. profiles/; fi
          touch since
          # A narrowed run covers part of a corpus under that corpus's own name, so it is measured
          # whether or not the whole of it is already published and is never published itself.
          narrowed=()
          if [[ -n "${FILTER}" ]]; then narrowed=(--filter "${FILTER}" --force); fi
          ./target/release/zkevm-prof profile \
            --zkvm "${ZKVM}" \
            --stateless-validator "${STATELESS_VALIDATOR}" \
            --suite "${SUITE}" \
            "${narrowed[@]}" \
            --output-dir profiles
          find profiles -name '*.json' -newer since -exec cp --parents {} produced/ \;
          # What the report reads, which is every run of this guest over the corpus rather than only
          # what this job wrote, so a guest skipped as already published is still reported.
          find "profiles/${STATELESS_VALIDATOR}" -name "${SUITE}.json" \
            -exec cp --parents {} standing/ \;

      # The report picks the newest run of each guest out of these, so it covers the whole matrix
      # whether a guest was measured again or skipped, and states figures this run holds rather
      # than figures read off a page a pull request never publishes to.
      - uses: actions/upload-artifact@v7
        with:
          name: profiles-${{ inputs.stateless-validator }}-${{ inputs.zkvm }}
          path: standing/profiles

      # The page is static and reads the runs it can load from an index written beside them, so the
      # site is published next to the profiles and the two registries it fetches, with the index
      # rebuilt over the whole branch.
      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZKVM: ${{ inputs.zkvm }}
          STATELESS_VALIDATOR: ${{ inputs.stateless-validator }}
        run: |
          bash .github/scripts/publish-page.sh \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            produced/profiles "profile ${STATELESS_VALIDATOR} on ${ZKVM}"
