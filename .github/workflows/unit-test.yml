name: Unit test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential clang libclang-dev libgmp-dev libomp-dev libopenmpi-dev \
            libsodium-dev nasm nlohmann-json3-dev openmpi-bin protobuf-compiler uuid-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build

      - run: cargo fmt --all --check

      - run: cargo clippy --release --all-targets --locked -- -D warnings

      - run: cargo test --release --locked
