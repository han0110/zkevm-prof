name: Unit test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # ere's catalog resolves ere's own workspace to name a zkVM SDK version, and that workspace carries
  # OpenVM, whose submodule tree holds the whole of openssl. libgit2 fails partway through a clone
  # that size, so fetching goes through the git CLI instead.
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The profile workflow publishes only from main, so the scripts behind that are checked here
      # instead of first running once they have already landed.
      - name: Check the scripts
        run: |
          shellcheck .github/scripts/*.sh
          python3 .github/scripts/report.py --help > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          # The cache is shared with the profile workflow, which needs its budget for the fixture
          # archives, so only main writes.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --all --check

      # A branch restores the cache main last wrote, so a revision newer than that is cloned cold,
      # and the OpenVM submodule tree is large enough that one network fault fails the job. The
      # compile clones it too, ere's catalog resolving ere's workspace from its own build script, so
      # both are retried.
      - name: Fetch dependencies
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --locked; then exit 0; fi
            sleep 15
          done
          exit 1

      - name: Lint
        run: |
          for attempt in 1 2 3; do
            if cargo clippy --release --all-targets --locked -- -D warnings; then exit 0; fi
            sleep 15
          done
          exit 1

      - run: cargo test --release --locked
