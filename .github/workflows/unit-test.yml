name: Unit test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # OpenVM's rvr backend translates a guest to C and builds it, so it picks the LLVM toolchain the
  # install step below puts on PATH rather than the distribution clang.
  RVR_CC: clang-22
  RVR_LD: lld

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential clang libclang-dev libgmp-dev libomp-dev libopenmpi-dev \
            libsodium-dev nasm nlohmann-json3-dev openmpi-bin protobuf-compiler uuid-dev

      - name: Install the LLVM toolchain
        run: bash .github/scripts/install-llvm.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          # The cache is shared with the profile workflow, which needs its budget for the fixture
          # archives, so only main writes.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --all --check

      - run: cargo clippy --release --all-targets --locked -- -D warnings

      - run: cargo test --release --locked
