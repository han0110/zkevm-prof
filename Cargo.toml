[workspace]
resolver = "3"
members = ["crates/zkevm-prof", "crates/zkvm-prof"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# openvm, which the library prices with and `examples/air_rows.rs` drives directly, so the pin is
# stated once rather than in each crate that reaches for it.
[workspace.dependencies]
openvm-sdk = { git = "https://github.com/han0110/openvm.git", branch = "patch/39c8462", default-features = false, features = ["parallel", "rvr"] }
openvm-sdk-config = { git = "https://github.com/han0110/openvm.git", branch = "patch/39c8462" }
openvm-stark-sdk = { git = "https://github.com/han0110/stark-backend.git", branch = "patch/v2.1.0-preview" }
openvm-transpiler = { git = "https://github.com/han0110/openvm.git", branch = "patch/39c8462" }
