[package]
name = "zkevm-prof"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
askama = "0.16"
clap = { version = "4", features = ["derive"] }
gag = "1"
hex = "0.4"
rayon = "1"
reqwest = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
walkdir = "2"

# zisk
zisk-common = { git = "https://github.com/0xPolygonHermez/zisk", tag = "v1.0.0-alpha" }
zisk-core = { git = "https://github.com/0xPolygonHermez/zisk", tag = "v1.0.0-alpha" }
ziskemu = { git = "https://github.com/0xPolygonHermez/zisk", tag = "v1.0.0-alpha" }

# openvm
openvm-sdk = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.1.0-preview", features = ["rvr"] }
openvm-sdk-config = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.1.0-preview" }
openvm-stark-sdk = { git = "https://github.com/han0110/stark-backend.git", branch = "patch/v2.1.0-preview" }
openvm-transpiler = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.1.0-preview" }

# sp1
sp1-core-executor = "6.3.1"

# ere
ere-catalog = { git = "https://github.com/eth-act/ere", tag = "v0.15.0" }

# ere-guests
stateless-validator-catalog = { git = "https://github.com/eth-act/ere-guests", tag = "v0.15.0" }
stateless-validator-downloader = { git = "https://github.com/eth-act/ere-guests", tag = "v0.15.0" }

[build-dependencies]
cargo_metadata = "0.23"
