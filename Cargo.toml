[package]
name = "zkevm-prof"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
askama = "0.16"
clap = { version = "4", features = ["derive"] }
gag = "1"
hex = "0.4"
rayon = "1"
reqwest = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
walkdir = "2"

# zisk
zisk-common = { git = "https://github.com/0xPolygonHermez/zisk", tag = "v1.0.0-alpha" }
zisk-core = { git = "https://github.com/0xPolygonHermez/zisk", tag = "v1.0.0-alpha" }
ziskemu = { git = "https://github.com/0xPolygonHermez/zisk", tag = "v1.0.0-alpha" }

# openvm
openvm-sdk = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0-preview", features = ["rvr"] }
openvm-sdk-config = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0-preview", default-features = false }
openvm-stark-sdk = { git = "https://github.com/openvm-org/stark-backend.git", branch = "develop-v2.1.0", default-features = false, features = ["parallel"] }
openvm-transpiler = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0-preview", default-features = false }

# ere
ere-catalog = { git = "https://github.com/eth-act/ere", rev = "c8d621df229526fbab3c8012656c38213e079b50" }

# ere-guests
stateless-validator-catalog = { git = "https://github.com/eth-act/ere-guests", rev = "c0e111032878843b496715d4b4903c7cd0ad2043" }
stateless-validator-downloader = { git = "https://github.com/eth-act/ere-guests", rev = "c0e111032878843b496715d4b4903c7cd0ad2043" }
