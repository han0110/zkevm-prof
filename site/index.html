            areaStyle: { color: THEME.border, opacity: 0.08 },
          },
          selectedDataBackground: {
            lineStyle: { color: THEME.primary, opacity: 0.6 },
            areaStyle: { color: THEME.primary, opacity: 0.08 },
          },
        },
      ],
      tooltip: {
        ...BASE_OPTION.tooltip,
        trigger: 'axis',
        formatter: (params) => {
          const point = params[0].value;
          // One row per run, for the fixture the head names. An axis trigger collects every point
          // sharing the pointer's position, and a corpus that bills hundreds of its fixtures the
          // same gas puts hundreds of them there, so the rows are taken by name rather than by
          // position.
          const drawn = params.filter((candidate) => candidate.value[3] === point[3]);
          // Against the smallest run on this fixture rather than over the whole corpus, so the ratio
          // reads as the comparison the fixture itself makes. A hidden run is not among the params,
          // which leaves the ratio between the runs actually drawn, and a lone one nothing to be
          // stated against.
          const smallest = drawn.reduce(
            (min, candidate) => Math.min(min, candidate.value[1]),
            Infinity
          );
          const figure = (value) =>
            drawn.length < 2
              ? scale.format(value)
              : scale.format(value) + ' / ' + ratio(value / smallest);
          const rows = drawn.map((candidate) => [
            marker(candidate.color) + escaped(candidate.seriesName),
            figure(candidate.value[1]),
          ]);
          return tooltipTable(fixtureHead(point), rows);
        },
      },
      // A point per fixture, so markers stay hidden until the axis pointer picks one out.
      series: series.map((line, index) => ({
        name: line.label,
        type: 'line',
        symbol: 'circle',
        symbolSize: 8,
        showSymbol: false,
        // Two runs of one stateless validator carry that validator's colour, so the dash pattern is
        // what tells them apart.
        lineStyle: { width: 2, color: line.color, type: line.dashed ? 'dashed' : 'solid' },
        itemStyle: { color: line.color, borderColor: THEME.surface, borderWidth: 2 },
        data: opened[index],
      })),
    });
  }, [series, scale]);

  /* Merged into the chart the order was drawn from, so neither the zoom window nor a hidden run is
     lost to a reordering. Only the gas order puts a figure on the x axis. */
  useEffect(() => {
    chart.current.setOption({
      xAxis: { axisLabel: { show: mode === 'gas' } },
      series: orderedPoints(series, mode).map((data) => ({ data })),
    });
  }, [series, mode]);

  return html`
    <${Card}
      title=${title}
      control=${html`<${Pill} onClick=${() => setMode(mode === 'gas' ? 'name' : 'gas')}>
        Sorted by ${mode}
      <//>`}>
      <div class="chart" style="height:420px" ref=${host}></div>
    <//>
  `;
}

/* The panels a set of runs is drawn as and the columns a run is listed by, shared by every page that
   shows one. */

/* What each column of prose is cut to, the version to the seven digits of a short commit hash and
   the other two to what leaves the columns beside them room. */
const SHORT_COMMIT = 68;

/* Stated where the ratio is, since a reader who takes the relative for a proving time prediction is
   reading more into it than the measurement carries. */
const RELATIVE_NOTE =
  'Empirically cost gaps overstate proving time gaps, so take the cost relative as a reference' +
  ' rather than a proving time prediction.';

/* A magnitude beside its ratio to the smallest of the runs shown, which is one cell because neither
   figure reads as a comparison without the other. A list that states no baseline shows the
   magnitude alone. */
const figure = (value, smallest, format) =>
  smallest == null ? format(value) : format(value) + ' / ' + ratio(value / smallest);

/* What a run profiled out of what its corpus holds, since a guest that failed on some blocks is
   otherwise indistinguishable from one that covered the corpus, coloured by which of the two it is
   so a short run is seen rather than read for. A corpus of unstated size leaves the count alone. */
const BlocksCovered = ({ covered, size }) =>
  size == null
    ? String(covered)
    : html`<span class=${covered === size ? 'complete' : 'partial'}>${covered} / ${size}</span>`;

/*
 * Every column a run is listed in, keyed on the run's index entry and reading its figures out of
 * `figures` when they are in. A page takes the ones it does not already state elsewhere.
 *
 * `baseline` holds the smallest mean cost and the smallest mean peak heap among the runs shown,
 * which turns the two figure columns into comparisons. A list of runs that are not comparable states
 * no baseline and prints the magnitudes alone. `suiteBlocks` gives a run's corpus its size, which is
 * what the blocks a run profiled are stated out of.
 */
function runColumns(figures, { baseline, suiteBlocks } = {}) {
  const of = (key) => (entry) => figures.get(entry.runId)?.[key] ?? null;
  return {
    guest: column(
      'guest',
      'Stateless validator',
      (entry) => entry.stateless_validator,
      (entry) => html`<${Link} href=${'runs/' + entry.runId}>${entry.stateless_validator}<//>`
    ),
    // A short commit is the whole of one version and the start of every other, so the column is held
    // to that and the rest is read off the hover.
    version: column(
      'version',
      'Version',
      (entry) => entry.stateless_validator_version,
      (entry) => html`<${Truncate} text=${entry.stateless_validator_version} width=${SHORT_COMMIT} />`
    ),
    zkvm: column('zkvm', 'zkVM', (entry) => entry.zkvm),
    zkvmVersion: column('zkvmVersion', 'zkVM version', (entry) => entry.zkvm_version),
    suite: column(
      'suite',
      'Suite',
      (entry) => entry.suite,
      (entry) => html`<${SuiteLink} suite=${entry.suite} />`
    ),
    profiled: column(
      'profiled',
      'Profiled',
      (entry) => entry.generated_at,
      (entry) => stamp(entry.generated_at)
    ),
    blocks: figureColumn(
      'blocks',
      'Blocks',
      of('fixtures'),
      (covered, entry) =>
        html`<${BlocksCovered} covered=${covered} size=${suiteBlocks?.(entry)} />`
    ),
    meanCost: figureColumn('meanCost', 'Mean cost', of('meanCost'), (value) =>
      figure(value, baseline?.cost, si)
    ),
    peakHeapMean: figureColumn('peakHeapMean', 'Mean peak heap', of('peakHeapMean'), (value) =>
      figure(value, baseline?.heap, bytes)
    ),
    sha256: column(
      'sha256',
      'ELF SHA256',
      (entry) => entry.elf_sha256 ?? null,
      (entry) => shortSha256(entry.elf_sha256)
    ),
    // Drawn rather than lettered, so it carries nothing to sort on.
    elf: {
      key: 'elf',
      header: 'ELF',
      render: (entry) =>
        html`<${ElfLink} url=${entry.elf_url} label=${entry.stateless_validator} />`,
    },
  };
}

/* What a run list can be broken up by, in the order a heading names them however they were turned
   on, so the groups read the same whichever chip was pressed first. Each names the column it stands
   for, which a list every run of which shares that value drops along with the grouping. */
const RUN_GROUPS = [
  { label: 'Stateless validator', column: 'guest', of: (entry) => entry.stateless_validator },
  { label: 'zkVM', column: 'zkvm', of: (entry) => entry.zkvm },
  { label: 'Suite', column: 'suite', of: (entry) => entry.suite },
];

/* What a comparison is fixed to, so a list broken up by all of them puts a comparison's worth of
   runs under one heading and nothing else does. */
const COMPARISON_GROUPS = ['zkVM', 'Suite'];

/*
 * The runs listing, which is the whole of the run list and again a panel of a suite. `fixed` names
 * what every run listed already shares, which is dropped from the columns and from what the list can
 * be broken up by. `figures` is read as the table draws, so a caller that fills it in as the profiles
 * land redraws the panel rather than waiting on them.
 */
function RunsPanel({ entries, figures, suiteBlocks, fixed = NOTHING }) {
  const groups = RUN_GROUPS.filter((group) => !fixed.includes(group.label));
  const [grouping, setGrouping] = useState(
    () => new Set(COMPARISON_GROUPS.filter((label) => !fixed.includes(label)))
  );
  /* The list opens on what each guest costs today, its history being what a reader asks for rather
     than what they land on. */
  const [latestOnly, setLatestOnly] = useState(true);
  /* Nothing until the reader opens a selection, which is also what puts the column in. */
  const [selected, setSelected] = useState(null);

  /* The zkVM and the corpus are what a reader picks a run list down to, and neither is offered
     where the list already stands for one of them. */
  const dimensions = useMemo(
    () =>
      [
        {
          kind: CHOICE,
          key: 'zkvm',
          label: 'zkVM',
          of: (entry) => entry.zkvm,
          // One shortcut per zkVM published, which is the cut a reader reaches for first and the
          // one the list is otherwise broken up by.
          presets: (domain) => domain,
        },
        { kind: CHOICE, key: 'suite', label: 'Suite', of: (entry) => entry.suite },
      ].filter((dimension) => !fixed.includes(dimension.label)),
    [fixed]
  );
  const narrowing = useFilters(dimensions, entries);

  const recent = useMemo(
    () => (latestOnly ? recentRuns(entries) : entries),
    [entries, latestOnly]
  );
  const listed = useMemo(
    () => (narrowing.narrowing ? recent.filter(narrowing.keep) : recent),
    [recent, narrowing.answers]
  );

  /* A run the listing no longer holds cannot be unpicked, so a narrowing takes it out of the
     selection and leaves every run still listed picked. */
  useEffect(() => {
    setSelected((held) => {
      if (!held?.size) return held;
      const shown = new Set(listed.map((entry) => entry.runId));
      const kept = [...held].filter((id) => shown.has(id));
      return kept.length === held.size ? held : new Set(kept);
    });
  }, [listed]);
  const byRunId = useMemo(
    () => new Map(entries.map((entry) => [entry.runId, entry])),
    [entries]
  );

  const shown = useMemo(() => {
    const columns = runColumns(figures, { suiteBlocks });
    const dropped = RUN_GROUPS.filter((group) => fixed.includes(group.label)).map(
      (group) => group.column
    );
    return [
      columns.guest,
      columns.version,
      columns.zkvm,
      columns.zkvmVersion,
      columns.suite,
      columns.profiled,
      columns.blocks,
      columns.meanCost,
      columns.peakHeapMean,
      columns.sha256,
      columns.elf,
    ].filter((column) => !dropped.includes(column.key));
  }, [figures, suiteBlocks, fixed]);

  const grouped = groups.some((group) => grouping.has(group.label));
  const groupKey = (entry) =>
    groups
      .filter((group) => grouping.has(group.label))
      .map((group) => group.of(entry))
      .join(' / ') || null;
  const folding = useFolding(listed, groupKey, grouping);

  /* The runs a selection may be extended by are fixed by the first one in it, so the constraint
     appears when the selection opens and lifts when it empties. */
  const anchor = selected?.size ? byRunId.get([...selected][0]) : null;

  /* The runs of a group that can actually be drawn together, which is the newest of them and every
     run comparable with it, one per guest. A group of one has nothing to compare. */
  const groupComparison = (rows) => {
    const newest = rows.reduce((held, entry) =>
      entry.generated_at > held.generated_at ? entry : held
    );
    const drawable = recentRuns(rows.filter((entry) => comparable(newest, entry)));
    return drawable.length > 1 ? drawable : null;
  };

  /* A group holding runs a comparison may take whole offers one. Any other grouping puts runs of
     two zkVMs or two corpora under one heading, which is not a comparison and carries no
     shortcut. */
  const groupControl = (rows) => {
    const whole = COMPARISON_GROUPS.every(
      (label) => fixed.includes(label) || grouping.has(label)
    );
    if (!whole) return null;
    const drawable = groupComparison(rows);
    if (!drawable) return null;
    return html`<${Link} href=${compareUrl(drawable.map((entry) => entry.runId))}>Compare<//>`;
  };

  /* Leaving the selection empties it, so the constraint the rows are disabled under never outlives
     the selection that set it. */
  const controls = html`
    <div class="chips">
      <${FoldPill} folding=${folding} enabled=${grouped} />
      ${selected
        ? html`
            <${Pill} onClick=${() => setSelected(null)}>Cancel<//>
            <${Pill}
              disabled=${selected.size < 2}
              onClick=${() => navigate(compareUrl([...selected]))}>
              Compare
            <//>
          `
        : html`<${Pill} onClick=${() => setSelected(EMPTY_SET)}>Select<//>`}
    </div>
  `;

  return html`
    <${Card} title="Runs" control=${controls}>
      <!-- Breaking the list up and narrowing it are different questions, and a reader cannot tell
           which a chip answers from its label alone, so each set stands behind its own. -->
      <div class="chip-sets">
        <${GroupChips}
          groups=${groups}
          grouping=${grouping}
          onToggle=${(label) => setGrouping((held) => toggled(held, label))} />
        <${Filters} filters=${narrowing} kept=${listed.length} total=${recent.length}>
          <${Chip} pressed=${latestOnly} onClick=${() => setLatestOnly((held) => !held)}>
            Latest
          <//>
        <//>
      </div>
      <${DataTable}
        columns=${shown}
        rows=${listed}
        rowKey=${(entry) => entry.runId}
        initialSort=${{ key: 'profiled', direction: 'descending' }}
        groupBy=${groupKey}
        groupControl=${groupControl}
        foldable=${grouped}
        folded=${folding.folded}
        onFold=${folding.fold}
        height=${null}
        selection=${selected &&
        {
          selected,
          enabled: (entry) => anchor == null || comparable(anchor, entry),
          onChange: (id, checked) =>
            setSelected((held) => {
              const next = new Set(held);
              if (checked) next.add(id);
              else next.delete(id);
              return next;
            }),
        }}
        empty="No run profiled yet." />
    <//>
  `;
}

/* Directory segments every block shares tell one from another nothing, so a grouping starts where
   the names first differ. */
function commonDepth(paths) {
  const [first = [], ...rest] = paths.map((path) => path.split('/'));
  let depth = 0;
  while (depth < first.length - 1 && rest.every((segments) => segments[depth] === first[depth])) {
    depth += 1;
  }
  return depth;
}

/* The test a case belongs to, which is the name past the path and before the parameters it was
   filled with. */
const testName = (name) => (name.split('::')[1] ?? '').split('[')[0];

/* The parameters a case was filled with, as the tokens they are written as. */
const caseTokens = (name) => {
  const open = name.indexOf('[');
  if (open < 0) return [];
  return name.slice(open + 1, name.lastIndexOf(']')).split('-');
};

/* The tokens every case in the corpus carries. Those name the corpus rather than the case, so what
   is left once they are taken off is what tells one row from another. Held by value rather than by
   position, since a case that takes an extra parameter carries the same tokens further along. */
function sharedTokens(cases) {
  const [first = [], ...rest] = cases;
  const shared = new Set(first);
  for (const tokens of rest) {
    const carried = new Set(tokens);
    for (const token of shared) {
      if (!carried.has(token)) shared.delete(token);
    }
  }
  return shared;
}

/* What a synthetic corpus's blocks may be broken up by, which is the test a case belongs to under
   where its file sits, once the segments every block shares are taken off. A corpus taken off the
   chain is one flat run of blocks and offers nothing to break it up by. */
function blockGroups(names) {
  const path = (name) => name.split('::')[0];
  const synthetic = names.filter((name) => !fromChain(name));
  if (!synthetic.length) return [];
  const depth = commonDepth(synthetic.map(path));
  return [
    {
      label: 'Test',
      of: (name) =>
        [...path(name).split('/').slice(depth), testName(name)].filter(Boolean).join(' / '),
    },
  ];
}

/*
 * How a corpus names its rows. A block pulled off the chain is named after the tool that pulled it
 * and a hash, so the block it holds is what names it. A synthetic one carries the path, the test and
 * the parameters it was filled with, of which the segments every block shares and the parameters
 * every case carries tell one row from another nothing, so neither is stated. What is left is the
 * parameters that are the case's own, under a heading that gives the rest, or that same heading
 * ahead of them where there is none. The whole of the name is on the clipboard from the button
 * beside it either way.
 */
function blockLabels(names) {
  const cases = names
    .filter((name) => !fromChain(name))
    .map(caseTokens)
    .filter((tokens) => tokens.length);
  const shared = sharedTokens(cases);
  return (name, block, heading) => {
    if (fromChain(name)) return 'Block #' + block.block_number;
    const own = caseTokens(name).filter((token) => !shared.has(token));
    const label = own.length ? own.join('-') : testName(name) || name;
    return heading ? heading(name) + ' / ' + label : label;
  };
}

/* Long enough after a keystroke that a corpus of a thousand rows is rebuilt once the reader has
   stopped typing rather than once per letter. The input is left uncontrolled, so typing redraws
   nothing until it settles. */
const SEARCH_DEBOUNCE = 200;

/* A listing of blocks opens in the order its corpus numbers or names them, which is the order a
   reader looks a block up in. Any other order is one column click away. */
const BLOCK_ORDER = { key: 'name', direction: 'ascending' };

/*
 * Every block a run or a corpus holds, one row each, filterable by name and broken up by the layers
 * a synthetic corpus's test names carry, which the panel folds and unfolds whole. `columns` are what
 * the caller measures a block by, which a corpus listed on its own has none of. The panel takes a
 * `title`, since a run lists the blocks it got through and the ones it did not the same way, and a
 * `control` the caller states its own choice with, which stands beside the panel's own.
 */
function BlocksPanel({
  names,
  metadata,
  columns = NOTHING,
  filters = NOTHING,
  title = 'Blocks',
  control,
}) {
  const [filter, setFilter] = useState('');
  const settling = useRef(0);
  const narrowing = useFilters(filters, names);

  const layers = useMemo(() => blockGroups(names), [names]);
  const blockLabel = useMemo(() => blockLabels(names), [names]);
  /* A listing opens broken up by what its corpus offers, the path being what tells one family of
     tests from another, and turning that off is what lists the blocks flat under their whole
     names. */
  const [grouping, setGrouping] = useState(() => new Set(layers.map((layer) => layer.label)));

  /* The heading a row stands under, and what the row is left to carry. A listing broken up by
     nothing draws no heading, so each row states the one it would have stood under itself. */
  const [groupKey, grouped, heading] = useMemo(() => {
    const [layer] = layers.filter((candidate) => grouping.has(candidate.label));
    const key = (name) => (layer && !fromChain(name) ? layer.of(name) : null);
    return [key, layer != null, layer ? null : (layers[0]?.of ?? null)];
  }, [layers, grouping]);

  const rows = useMemo(() => {
    if (!filter && !narrowing.narrowing) return names;
    const needle = filter.toLowerCase();
    return names.filter((name) => {
      const named =
        !needle ||
        (name + ' ' + blockLabel(name, metadata(name), heading)).toLowerCase().includes(needle);
      return named && narrowing.keep(name);
    });
  }, [names, filter, heading, narrowing.answers]);

  const folding = useFolding(rows, groupKey, grouping);

  const panelControls = html`
    <div class="chips">
      <!-- A corpus taken off the chain is one flat run of blocks, so it is offered neither the
           layers to break it up by nor the fold that only a heading has to give. -->
      ${layers.length > 0 && html`<${FoldPill} folding=${folding} enabled=${grouped} />`}
      ${control}
      <input
        type="search"
        class="search"
        placeholder="Filter blocks"
        aria-label="Filter blocks by name"
        onInput=${(event) => {
          const typed = event.currentTarget.value.trim();
          clearTimeout(settling.current);
          settling.current = setTimeout(() => {
            setFilter(typed);
            // Nothing the control closed is held back from a reader who is searching, so a filter
            // opens it again and the control goes back to offering the fold.
            if (typed && folding.closedAll) folding.closeAll(false);
          }, SEARCH_DEBOUNCE);
        }} />
    </div>
  `;

  return html`
    <${Card} title=${title} control=${panelControls}>
      ${(layers.length > 0 || narrowing.offered.length > 0) &&
      html`<div class="chip-sets">
        ${layers.length > 0 &&
        html`<${GroupChips}
          groups=${layers}
          grouping=${grouping}
          onToggle=${(label) => setGrouping((held) => toggled(held, label))} />`}
        ${narrowing.offered.length > 0 &&
        html`<${Filters} filters=${narrowing} kept=${rows.length} total=${names.length} />`}
      </div>`}
      <${DataTable}
        columns=${[
          {
            key: 'name',
            header: 'Block',
            // Takes what the other columns leave, so a name is shown whole wherever there is room
            // for it. A caller that claims the slack too shares it with the name rather than
            // leaving the rows it lists unidentifiable.
            fill: true,
            // Only a row stating the whole name can outrun the column, so only it is offered the
            // overlay. A block off the chain is read by its number and one standing under a heading
            // carries the case alone, and neither is longer than the room it has.
            render: (name) => html`
              <div class="block-name">
                <${Truncate}
                  text=${blockLabel(name, metadata(name), heading)}
                  overlay=${!grouped && !fromChain(name)} />
                <${CopyButton} text=${name} label=${'Copy the full name of ' + name} />
              </div>
            `,
            sortValue: (name) => (fromChain(name) ? metadata(name).block_number : name),
          },
          figureColumn('gas', 'Gas', (name) => metadata(name).gas_used, si),
          ...columns,
        ]}
        rows=${rows}
        rowKey=${(name) => name}
        initialSort=${BLOCK_ORDER}
        groupBy=${groupKey}
        foldable=${grouped}
        folded=${folding.folded}
        onFold=${folding.fold}
        height=${narrowing.offered.length > 0 ? 'fixed' : 'capped'}
        empty=${() =>
          filter
            ? 'No block named like ' + filter + '.'
            : narrowing.narrowing
              ? 'No block within the bounds set.'
              : 'No block here.'} />
    <//>
  `;
}

/* Stateless validator then version, which fixes the order of the overview rows, the composition bars
   and the chart legends alike. */
const byGuest = (left, right) =>
  left.stateless_validator.localeCompare(right.stateless_validator) ||
  left.stateless_validator_version.localeCompare(right.stateless_validator_version);

/*
 * The charts a set of runs is drawn as, which is what a comparison and a single run both show below
 * their own heading. `shares` opens the composition as the share each kind takes of the total, which
 * is what a lone run has to say since it has no other run to be measured against.
 */
function CostPanels({ rows, fixtures, shares }) {
  const kinds = useMemo(() => rows[0].entry.composition.map((kind) => kind.name), [rows]);
  const notes = useMemo(() => rows[0].entry.composition.map((kind) => kind.note), [rows]);
  const colors = guestColors(rows.map((row) => row.entry.stateless_validator));

  /* A version tells two runs of one stateless validator apart, so it is stated only where one name
     stands for more than one run. */
  const label = (entry) =>
    rows.filter((row) => row.entry.stateless_validator === entry.stateless_validator).length > 1
      ? entry.stateless_validator + ' ' + entry.stateless_validator_version
      : entry.stateless_validator;

  /* Runs of one stateless validator carry that validator's colour, so all but the first of the ones
     a chart actually draws are told apart by their dash pattern. */
  const series = (points) => {
    const drawn = rows
      .map((row) => ({ row, points: points(row) }))
      .filter((candidate) => candidate.points.length);
    return drawn.map((candidate, index) => ({
      label: label(candidate.row.entry),
      color: colors[candidate.row.entry.stateless_validator],
      dashed:
        drawn.findIndex(
          (other) => other.row.entry.stateless_validator === candidate.row.entry.stateless_validator
        ) !== index,
      points: candidate.points,
    }));
  };

  const cost = useMemo(() => series((row) => row.statistics.points), [rows]);
  const heap = useMemo(() => series((row) => row.statistics.heapPoints), [rows]);
  const bars = useMemo(
    () =>
      rows.map((row) => ({
        label: label(row.entry),
        // Drawn per fixture, so a bar totals to the cost stated beside it.
        components: row.statistics.components.map((value) => value / fixtures.length),
      })),
    [rows, fixtures]
  );

  /* A zkVM that prices an execution as one number leaves the total nothing to be split into, and the
     page drops the composition panel along with it. */
  return html`
    ${kinds.length > 0 &&
    html`<${Card} title="Cost composition">
      <${CompositionChart}
        series=${bars}
        kinds=${kinds}
        notes=${notes}
        shares=${shares} />
    <//>`}
    ${cost.length > 0 &&
    html`<${LineChartPanel}
      title="Cost against gas usage"
      series=${cost}
      scale=${COST_SCALE} />`}
    ${heap.length > 0 &&
    html`<${LineChartPanel}
      title="Peak heap against gas usage"
      series=${heap}
      scale=${HEAP_SCALE} />`}
  `;
}

/* The five pages. Each loads what it draws from and renders nothing until it is in, since a page
   whose numbers have not landed has nothing to say. */

function useAsync(load, deps) {
  const [state, setState] = useState({});
  useEffect(() => {
    let live = true;
    setState({});
    Promise.resolve()
      .then(load)
      .then(
        (value) => live && setState({ value }),
        (error) => live && setState({ error })
      );
    return () => {
      live = false;
    };
  }, deps);
  return state;
}

/*
 * The statistics of every run given, filled in once the profiles have landed, so a listing draws at
 * once rather than waiting on a file per run. A run whose profile is not published keeps its figures
 * empty rather than emptying every other run's alongside it.
 */
function useFigures(entries) {
  const [figures, setFigures] = useState(() => new Map());
  useEffect(() => {
    let live = true;
    Promise.allSettled(entries.map((entry) => loadRun(entry))).then((results) => {
      if (!live) return;
      const held = new Map();
      results.forEach((result, index) => {
        if (result.status !== 'fulfilled') return;
        held.set(entries[index].runId, ownStatistics(result.value));
      });
      setFigures(held);
    });
    return () => {
      live = false;
    };
  }, [entries]);
  return figures;
}

const RunsView = ({ entries, suiteBlocks }) => {
  const figures = useFigures(entries);
  return html`<${RunsPanel} entries=${entries} figures=${figures} suiteBlocks=${suiteBlocks} />`;
};

function RunsPage() {
  const state = useAsync(() => Promise.all([loadIndex(), loadSuiteBlocks()]), []);
  if (state.error) return html`<${ErrorCard} message=${state.error.message} />`;
  if (!state.value) return null;
  const [{ runs }, suiteBlocks] = state.value;
  return html`<${RunsView} entries=${runs} suiteBlocks=${suiteBlocks} />`;
}

function RunView({ entry, run, fixtures, figures, size }) {
  /* A block is read for what it spent its cost on rather than for the magnitudes, which is what the
     total beside them already carries, so the kinds open as shares of it. */
  const [shares, setShares] = useState(true);
  const cost = (name) => run.profile[name].cost;
  const metadata = (name) => run.profile[name].metadata;
  /* What the run is short of its corpus by, listed the same way and only where there is something
     to list. A profile written before failures were recorded carries none. */
  const failed = Object.keys(run.failures ?? {});

  /* Every figure the listing states, offered as a bound on it. A kind is offered twice, once in the
     unit it was profiled in and once as the share it takes of the total, since a block is asked for
     both what a kind cost and what it dominated. */
  const drawn = useMemo(() => [{ entry, statistics: figures }], [entry, figures]);

  const dimensions = useMemo(
    () => [
      { kind: RANGE, key: 'gas', label: 'Gas', of: (name) => metadata(name).gas_used, print: si },
      {
        kind: RANGE,
        key: 'total',
        label: 'Cost',
        of: (name) => cost(name).total,
        print: si,
        presets: () => [95, 99],
      },
      ...entry.composition.flatMap((kind) => [
        {
          kind: RANGE,
          key: 'kind:' + kind.name,
          label: kind.name,
          of: (name) => cost(name)[kind.name],
          print: si,
        },
        {
          kind: RANGE,
          key: 'share:' + kind.name,
          label: kind.name + ' share',
          of: (name) => cost(name)[kind.name] / cost(name).total,
          print: percent,
        },
      ]),
      {
        kind: RANGE,
        key: 'heap',
        label: 'Peak heap',
        of: (name) => run.profile[name].peak_heap_bytes ?? null,
        print: bytes,
        presets: () => [95, 99],
      },
    ],
    [run, entry]
  );

  return html`
    <!-- What was profiled over what it was profiled on, which is the guest and its build against the
         measurement taken of it. -->
    <${Card} title="Run">
      <${FieldStrip}>
        <${Field} label="Stateless validator">${entry.stateless_validator}<//>
        <${Field} label="Version">
          <${Truncate} text=${entry.stateless_validator_version} />
        <//>
        <${Field} label="zkVM">${entry.zkvm}<//>
        <${Field} label="zkVM version">${entry.zkvm_version}<//>
        <${Field} label="ELF SHA256">
          <${Truncate} text=${shortSha256(entry.elf_sha256) || DASH} />
        <//>
        <${Field} label="ELF">
          <${ElfLink}
            url=${entry.elf_url}
            label=${entry.stateless_validator}
            fallback=${DASH} />
        <//>
      <//>
      <${FieldStrip}>
        <${Field} label="Profiled">${stamp(entry.generated_at)}<//>
        <${Field} label="Suite">
          <${SuiteLink} suite=${entry.suite} />
        <//>
        <${Field} label="Blocks">
          <${BlocksCovered} covered=${figures.fixtures} size=${size} />
        <//>
        <${Field} label="Mean cost">${si(figures.meanCost)}<//>
        <${Field} label="Mean peak heap">
          ${figures.peakHeapMean == null ? DASH : bytes(figures.peakHeapMean)}
        <//>
      <//>
    <//>
    <!-- A lone run has nothing to be measured against, so what its cost splits into is all its
         composition has to say. -->
    <${CostPanels} rows=${drawn} fixtures=${fixtures} shares />
    <${BlocksPanel}
      names=${fixtures}
      metadata=${metadata}
      filters=${dimensions}
      control=${html`<${Pill} onClick=${() => setShares((held) => !held)}>
        ${shares ? 'Show cost' : 'Show percentage'}
      <//>`}
      columns=${[
        figureColumn('total', 'Cost', (name) => cost(name).total, si),
        // Keyed apart from the fixed columns, since a zkVM is free to call one of its kinds `total`.
        ...entry.composition.map((kind) =>
          figureColumn(
            'kind:' + kind.name,
            kind.name,
            (name) =>
              shares ? cost(name)[kind.name] / cost(name).total : cost(name)[kind.name],
            shares ? percent : si
          )
        ),
        figureColumn(
          'heap',
          'Peak heap',
          (name) => run.profile[name].peak_heap_bytes ?? null,
          bytes
        ),
      ]} />
    ${failed.length > 0 &&
    html`<${BlocksPanel}
      title="Failures"
      names=${failed}
      metadata=${(name) => run.failures[name].metadata}
      columns=${[
        // Sized to what it holds, as every column but the one holding the names is, and read on one
        // line, since what a backend reported is the whole of why the block is listed here.
        column('reason', 'Reason', (name) => run.failures[name].reason),
      ]} />`}
  `;
}

function RunPage({ id }) {
  const state = useAsync(async () => {
    const [{ byRunId }, suiteBlocks] = await Promise.all([loadIndex(), loadSuiteBlocks()]);
    const entry = byRunId.get(id);
    if (!entry) throw new Error('No run ' + id);
    const run = await loadRun(entry);
    const fixtures = sharedFixtures([run]);
    return { entry, run, fixtures, figures: statistics(run, fixtures), size: suiteBlocks(entry) };
  }, [id]);
  if (state.error) return html`<${ErrorCard} message=${state.error.message} />`;
  if (!state.value) return null;
  return html`<${RunView} ...${state.value} />`;
}

function ComparePage({ ids }) {
  const state = useAsync(async () => {
    const { byRunId } = await loadIndex();
    const missing = ids.find((id) => !byRunId.has(id));
    if (missing) throw new Error('No run ' + missing);
    const entries = ids.map((id) => byRunId.get(id));
    /* Costs from two zkVMs are in different units, costs from two SDK versions come from different
       circuits and two corpora share no block, so a request naming any of those is refused rather
       than drawn on one axis. */
    const mixed = entries.find((entry) => !comparable(entries[0], entry));
    if (mixed) {
      throw new Error('Run ' + mixed.runId + ' is not comparable with ' + entries[0].runId);
    }
    const runs = await Promise.all(entries.map((entry) => loadRun(entry)));
    return { entries, runs, fixtures: sharedFixtures(runs) };
  }, [ids.join(',')]);
  if (state.error) return html`<${ErrorCard} message=${state.error.message} />`;
  if (!state.value) return null;
  const { entries, runs, fixtures } = state.value;

  /* The overview table and the charts, over the fixtures every run in the comparison profiled, so a
     set spanning corpora can leave none at all and there is nothing to draw. */
  const drawn = () => {
    if (!fixtures.length) {
      return html`<${Card} title="Overview">
        <p class="empty">These runs share no profiled fixture.</p>
      <//>`;
    }
    // entries and runs are parallel, an index entry beside the profile it names.
    const rows = entries
      .map((entry, index) => ({ entry, statistics: statistics(runs[index], fixtures) }))
      .sort((left, right) => byGuest(left.entry, right.entry));
    const heaps = rows.map((row) => row.statistics.peakHeapMean).filter((peak) => peak != null);
    /* A lone run has nothing to be stated against, and a ratio of one against itself says less than
       the magnitude alone. */
    const baseline =
      rows.length < 2
        ? null
        : {
            cost: Math.min(...rows.map((row) => row.statistics.meanCost)),
            heap: heaps.length ? Math.min(...heaps) : null,
          };
    const columns = runColumns(new Map(rows.map((row) => [row.entry.runId, row.statistics])), {
      baseline,
    });
    return html`
      <${Card} title="Overview">
        <p>${RELATIVE_NOTE}</p>
        <${DataTable}
          columns=${[
            columns.guest,
            columns.version,
            columns.meanCost,
            columns.peakHeapMean,
            columns.sha256,
            columns.elf,
          ]}
          rows=${rows.map((row) => row.entry)}
          rowKey=${(entry) => entry.runId} />
      <//>
      <${CostPanels} rows=${rows} fixtures=${fixtures} />
    `;
  };

  return html`
    <!-- What every run in the comparison holds in common, which is what makes it one, and the span
         the panels below are over. -->
    <${Card} title="Configurations">
      <${FieldStrip}>
        <${Field} label="zkVM">${entries[0].zkvm}<//>
        <${Field} label="zkVM version">${entries[0].zkvm_version}<//>
        <${Field} label="Suite">
          <${SuiteLink} suite=${entries[0].suite} />
        <//>
        <${Field} label="Blocks">${String(fixtures.length)}<//>
      <//>
    <//>
    ${drawn()}
  `;
}

function SuitesPage() {
  const state = useAsync(() => Promise.all([loadSuites(), loadIndex()]), []);
  if (state.error) return html`<${ErrorCard} message=${state.error.message} />`;
  if (!state.value) return null;
  const [suites, { runs: entries }] = state.value;
  const runsOf = (suite) => entries.filter((entry) => entry.suite === suite.name).length;

  // Every column here is answered by the registry and the index, so listing the suites loads no
  // profile at all.
  return html`
    <${Card} title="Suites">
      <${DataTable}
        columns=${[
          column(
            'suite',
            'Suite',
            (suite) => suite.name,
            (suite) => html`<${SuiteLink} suite=${suite.name} />`
          ),
          {
            ...column(
              'description',
              'Description',
              (suite) => suite.description,
              (suite) => html`<${Truncate} text=${suite.description} />`
            ),
            fill: true,
          },
          figureColumn('blocks', 'Blocks', (suite) => suite.blocks.length, String),
          // A corpus nothing has been profiled over still sorts as the nothing it holds.
          figureColumn('runs', 'Runs', runsOf, (count) => (count ? String(count) : DASH)),
        ]}
        rows=${suites}
        rowKey=${(suite) => suite.name}
        initialSort=${{ key: 'suite', direction: 'ascending' }}
        empty="No suite registered." />
    <//>
  `;
}

/* Every run of a suite's own page is of this corpus, which is therefore no column and no
   grouping. */
const SUITE_FIXED = ['Suite'];

function SuiteView({ suite, entries }) {
  const figures = useFigures(entries);

  /* The corpus as the registry states it, which is every block in it against the number and the gas
     the block carries, so the listing is the corpus rather than the part of it some run reached. */
  const names = useMemo(() => suite.blocks.map((block) => block.name), [suite]);
  const metadata = useMemo(
    () => new Map(suite.blocks.map((block) => [block.name, block])),
    [suite]
  );

  return html`
    <${Card} title="Suite">
      <${FieldStrip}>
        <${Field} label="Name">${suite.name}<//>
        <${Field} label="Description">${suite.description}<//>
        <${Field} label="Blocks">${String(suite.blocks.length)}<//>
        <${Field} label="Runs">${String(entries.length)}<//>
      <//>
    <//>
    <${BlocksPanel}
      names=${names}
      metadata=${(name) => metadata.get(name)} />
    <${RunsPanel}
      entries=${entries}
      figures=${figures}
      suiteBlocks=${() => suite.blocks.length}
      fixed=${SUITE_FIXED} />
  `;
}

function SuitePage({ name }) {
  const state = useAsync(async () => {
    const [suites, { runs }] = await Promise.all([loadSuites(), loadIndex()]);
    const suite = suites.find((candidate) => candidate.name === name);
    if (!suite) throw new Error('No suite named ' + name);
    return { suite, entries: runs.filter((entry) => entry.suite === name) };
  }, [name]);
  if (state.error) return html`<${ErrorCard} message=${state.error.message} />`;
  if (!state.value) return null;
  return html`<${SuiteView} ...${state.value} />`;
}

/* The run list is the page the site opens on, so the root stands for it, and a comparison is reached
   from that list and returns to it, so both stand under the same section. */
const SECTIONS = [
  { href: 'runs', label: 'Runs' },
  { href: 'suites', label: 'Suites' },
];

function page(full) {
  const [path, search = ''] = full.split('?');
  if (path === 'compare') {
    const runs = new URLSearchParams(search).get('runs');
    return {
      section: 'runs',
      view: runs
        ? html`<${ComparePage} ids=${runs.split(',')} />`
        : html`<${ErrorCard} message="No run to compare" />`,
    };
  }
  if (path === 'runs') return { section: 'runs', view: html`<${RunsPage} />` };
  if (path.startsWith('runs/')) {
    return { section: 'runs', view: html`<${RunPage} id=${path.slice('runs/'.length)} />` };
  }
  if (path === 'suites') return { section: 'suites', view: html`<${SuitesPage} />` };
  if (path.startsWith('suites/')) {
    return {
      section: 'suites',
      view: html`<${SuitePage} name=${path.slice('suites/'.length)} />`,
    };
  }
  return {
    section: null,
    view: html`<${ErrorCard} message=${'No page at ' + BASE + path} />`,
  };
}

/* A profile that parses but is not shaped as the page expects throws while it is being drawn rather
   than while it is being read, which is reported where the page would have been rather than left as
   a blank screen. It is keyed on the route, so leaving the page that failed clears it. */
function Drawn({ children }) {
  const [error] = useErrorBoundary();
  if (error) return html`<${ErrorCard} message=${error.message} />`;
  return children;
}

function App() {
  const full = route.value;
  const { section, view } = page(full);

  // A reader who lands on the root, or on a route spelled with the slash a directory would carry,
  // leaves with the address that names what they are looking at.
  useEffect(() => {
    const url = new URL(full, document.baseURI);
    if (url.pathname !== location.pathname) history.replaceState(null, '', url);
  }, [full]);

  return html`
    <header>
      <h1>zkEVM guest cost estimation</h1>
      <nav aria-label="Sections">
        ${SECTIONS.map(
          (item) => html`
            <${Link}
              key=${item.href}
              class="nav-link"
              href=${item.href}
              aria-current=${section === item.href ? 'page' : null}>
              ${item.label}
            <//>
          `
        )}
      </nav>
    </header>
    <!-- Keyed on the route, so leaving a page throws away everything it held, the charts it mounted
         included. -->
    <main key=${full}><${Drawn}>${view}<//></main>
  `;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
